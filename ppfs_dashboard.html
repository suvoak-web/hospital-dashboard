<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2744">
<title>PPFS NHSO — อัตราจ่ายและสิทธิประโยชน์ พ.ศ. 2568</title>
<style>
  :root, [data-theme="dark"] {
    --bg:#0b1220; --card:#141c2e; --card2:#1a2438; --line:#2a3a52;
    --text:#f2f5f9; --muted:#94a3b8; --accent:#5eead4; --gold:#e8c47a;
    --blue:#93c5fd; --red:#fca5a5; --chip:#1c2840; --green:#99f6e4;
    --warnbg:#2a1820; --warnborder:#5c3040; --header:#0b1220f2;
    --elig:#5eead4; --boxbg:#132e2a; --refbg:#121c2c;
  }
  [data-theme="light"] {
    --bg:#f8f6f3; --card:#ffffff; --card2:#faf8f6; --line:#e7e2db;
    --text:#1c1917; --muted:#78716c; --accent:#0f766e; --gold:#b45309;
    --blue:#1d4ed8; --red:#dc2626; --chip:#f5f0eb; --green:#047857;
    --warnbg:#fef2f2; --warnborder:#fecaca; --header:#fffcfa;
    --elig:#0f766e; --boxbg:#f0fdfa; --refbg:#f5f5f4;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family: "Sarabun","Noto Sans Thai","Segoe UI",sans-serif;
    font-size:16px; line-height:1.45;
  }
  header {
    position:sticky; top:0; z-index:20;
    background:var(--header); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line); padding:12px 14px 10px;
  }
  h1 { margin:0; font-size:20px; letter-spacing:-.2px; }
  .sub { color:var(--muted); font-size:13px; margin-top:2px; }
  .theme-row { display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
  .theme-btn {
    border:1px solid var(--line); background:var(--card); color:var(--text);
    border-radius:999px; padding:6px 12px; font-size:13px;
  }
  .search {
    margin-top:10px; width:100%; border:1px solid var(--line); background:var(--card);
    color:var(--text); border-radius:14px; padding:13px 16px; font-size:16px;
    outline: none; transition: border-color .15s ease;
  }
  .search:focus { border-color: var(--accent); }
  .chips { display:flex; gap:8px; overflow:auto; padding:10px 14px 4px; }
  .chip {
    border:1px solid var(--line); background:var(--chip); color:var(--text);
    border-radius:999px; padding:8px 14px; white-space:nowrap; font-size:14px;
    transition: background .15s ease, color .15s ease;
  }
  .chip.on { background:var(--accent); color:#08332c; border-color:var(--accent); font-weight:700; }
  main { padding:6px 14px 80px; max-width:880px; margin:0 auto; }
  .section-title { margin:18px 0 10px; font-size:20px; font-weight:700; letter-spacing:-.2px; color:var(--text); }
  .bundle {
    background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:12px 14px; margin-bottom:8px;
    display:flex; justify-content:space-between; gap:12px; align-items:center;
    color:var(--text);
  }
  .bundle .bname { font-size:18px; font-weight:700; letter-spacing:-0.2px; line-height:1.3; margin-bottom:2px; }
  .bundle b { font-size:18px; color:var(--accent); }
  .bundle small { color:var(--muted); display:block; }
  .card {
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    margin-bottom:12px; overflow:hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card.open { box-shadow: 0 4px 12px rgba(0,0,0,.12); }
  .card.strict { border-color:#7a3340; }
  .card button.head {
    width:100%; text-align:left; background:transparent; color:inherit; border:0;
    padding:14px; display:grid; grid-template-columns:1fr auto; gap:8px; align-items:start;
  }
  .svc { color:var(--blue); font-size:13px; }
  .title { font-size:18px; font-weight:700; margin-top:3px; letter-spacing:-0.2px; line-height:1.3; }
  .meta { color:var(--muted); font-size:13px; margin-top:4px; }
  .eligible-preview {
    margin-top:6px; font-size:13px; color:var(--elig);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .warn-preview {
    margin-top:4px; font-size:12px; color:var(--red); font-weight:600;
  }
  .rate { text-align:right; }
  .rate strong { display:block; font-size:22px; color:var(--accent); }
  .rate span { color:var(--muted); font-size:12px; }
  .badge {
    display:inline-block; margin-top:6px; margin-right:6px; font-size:12px;
    border-radius:999px; padding:4px 9px; background:#334155; color:#f1f5f9;
  }
  .badge.hi { background:#422006; color:#fde68a; }
  .badge.vol { background:#134e4a; color:#99f6e4; }
  .badge.off { background:#450a0a; color:#fecaca; }
  .badge.warn { background:#7f1d1d; color:#fecaca; }
  .detail { display:none; border-top:1px solid var(--line); padding:12px 14px 14px; background:var(--card2); }
  .card.open .detail { display:block; }
  .kv { margin:0 0 8px; }
  .kv em { color:var(--gold); font-style:normal; font-weight:700; display:block; font-size:13px; }
  /* NOTE: This is a truncated start for the call; full content must be used in actual upload */
</style>
</head>
