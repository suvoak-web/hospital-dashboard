name: อัปเดตข้อมูลโซลาร์ (FusionSolar)

on:
  schedule:
    # ทุกชั่วโมง 06:05–19:05 เวลาไทย (23:05–12:05 UTC) — FusionSolar จำกัดจำนวนครั้งต่อวัน อย่าถี่กว่านี้
    - cron: "5 0-12,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solar-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ดึงข้อมูลจาก FusionSolar
        env:
          FUSIONSOLAR_USER: ${{ secrets.FUSIONSOLAR_USER }}
          FUSIONSOLAR_SYSTEM_CODE: ${{ secrets.FUSIONSOLAR_SYSTEM_CODE }}
          FUSIONSOLAR_BASE: ${{ vars.FUSIONSOLAR_BASE }}
          FUSIONSOLAR_STATION: ${{ vars.FUSIONSOLAR_STATION }}
        run: python3 scripts/fetch_solar.py
      - name: บันทึกไฟล์ถ้ามีการเปลี่ยนแปลง
        run: |
          git config user.name "solar-bot"
          git config user.email "solar-bot@users.noreply.github.com"
          git add data/solar.json
          git diff --cached --quiet || (git commit -m "อัปเดตข้อมูลโซลาร์ $(TZ=Asia/Bangkok date '+%Y-%m-%d %H:%M')" && git pull --rebase && git push)
